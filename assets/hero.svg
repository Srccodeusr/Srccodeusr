<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 386" width="860" height="386" role="img" aria-label="Srccodeusr profile: Discord bot developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Segoe UI','SF Pro Text',-apple-system,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.reveal{opacity:0;animation:rv .7s ease-out 1.9s forwards}
@keyframes rv{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pg{transform-box:fill-box;transform-origin:0 50%;animation:pg 30s linear infinite}
@keyframes pg{from{transform:scaleX(.04)}to{transform:scaleX(1)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.reveal{opacity:1}}
</style>
